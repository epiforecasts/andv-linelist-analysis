name: Test

# Manual only: the analysis is complete and its environment is pinned in the
# tracked manifests. Run this by hand when picking the work back up.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          # Matches the julia_version recorded in the committed manifests.
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=test test/runtests.jl
