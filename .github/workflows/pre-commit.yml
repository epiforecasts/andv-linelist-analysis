name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        # Pinned: an unbounded install reformats the tree whenever
        # JuliaFormatter changes its line-breaking, turning every PR red.
        run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2.3")'
      - uses: pre-commit/action@v3.0.1
